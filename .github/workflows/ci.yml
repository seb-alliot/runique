name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DB_ENGINE: postgres

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta, nightly]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check
        continue-on-error: ${{ matrix.rust == 'nightly' }}

      # `big-pk` et `pk-uuid` sont mutuellement exclusives (compile_error! si les deux
      # sont actives) — --all-features les active toutes les deux à la fois, donc le
      # sweep principal les exclut ici et chacune est testée séparément juste après.
      - name: Run clippy
        run: cargo clippy --all-targets --features orm,sqlite,postgres,mysql,mariadb,all-databases,acme -- -D warnings
        continue-on-error: ${{ matrix.rust == 'nightly' }}

      - name: Run clippy (big-pk)
        run: cargo clippy --all-targets --features big-pk -- -D warnings
        continue-on-error: ${{ matrix.rust == 'nightly' }}

      - name: Run clippy (pk-uuid)
        run: cargo clippy --all-targets --features pk-uuid -- -D warnings
        continue-on-error: ${{ matrix.rust == 'nightly' }}

      - name: Build
        run: cargo build --verbose --features orm,sqlite,postgres,mysql,mariadb,all-databases,acme

      - name: Run tests
        run: cargo test --verbose --features orm,sqlite,postgres,mysql,mariadb,all-databases,acme
        working-directory: runique

      - name: Run tests (big-pk)
        run: cargo test --verbose --features big-pk
        working-directory: runique

      - name: Run tests (pk-uuid)
        run: cargo test --verbose --features pk-uuid
        working-directory: runique

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit
        continue-on-error: true

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build documentation
        run: cargo doc --no-deps --features orm,sqlite,postgres,mysql,mariadb,all-databases,acme
        working-directory: runique
        continue-on-error: true