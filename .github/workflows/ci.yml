name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No job writes to the repository: the token stays read-only.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DB_ENGINE: postgres

jobs:
  # Formatting, lints and the workspace build: no database needed.
  lint:
    name: Format, clippy, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.toml') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      # `big-pk` et `pk-uuid` sont mutuellement exclusives (compile_error! si les deux
      # sont actives) — --all-features les active toutes les deux à la fois, donc le
      # sweep principal les exclut ici et chacune est testée séparément juste après.
      - name: Run clippy
        run: cargo clippy --all-targets --features orm,sqlite,postgres,mysql,all-databases,acme,admin,test-utils -- -D warnings

      # working-directory: runique — sans ça, cargo cible tout le workspace (demo-app
      # inclus), qui hérite de la feature par unification et casse pour du code qui
      # ne l'a jamais demandée (cf. contribution.rs, seeds/*.rs en i32 en dur).
      - name: Run clippy (big-pk)
        run: cargo clippy --all-targets --features big-pk -- -D warnings
        working-directory: runique

      - name: Run clippy (pk-uuid)
        run: cargo clippy --all-targets --features pk-uuid -- -D warnings
        working-directory: runique

      - name: Build
        run: cargo build --verbose --features orm,sqlite,postgres,mysql,all-databases,acme,admin

  # One job per feature set, in parallel, each on its own runner with a fresh
  # MySQL and Postgres: no table left by one key type (int, bigint, uuid)
  # in the way of the next.
  test:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Without `test-utils`, six modules are left out with no warning (0 test
          # run): test_validation_form, test_form_guarantees, test_hooks,
          # test_login_form, test_builder and the handler_req helper.
          # Every crate of the workspace but demo-app, which has its own job
          # (`demo`): one build of it per engine.
          - name: all features
            features: orm,sqlite,postgres,mysql,all-databases,acme,admin,test-utils
            workspace: true
            dir: .
          # From `runique/`, the framework alone: demo-app has its own job per
          # key type, and always turns the admin on.
          - name: big-pk
            features: big-pk,all-databases,admin
            dir: runique
          - name: pk-uuid
            features: pk-uuid,all-databases,admin
            dir: runique
          # The admin is an opt-in feature: the framework must build and pass its
          # tests without it too (admin tests are `#[cfg(feature = "admin")]`).
          - name: without admin
            features: all-databases
            dir: runique
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: runique
          MYSQL_PASSWORD: runique_test
          MYSQL_DATABASE: runique_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      # Same settings as docker-compose.yml: messages in English (`lc-messages=C`),
      # which some tests read.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: runique
          POSTGRES_PASSWORD: runique_test
          POSTGRES_DB: runique_test
          POSTGRES_INITDB_ARGS: "--locale=C --lc-messages=C"
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U runique -d runique_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL_MYSQL: mysql://runique:runique_test@127.0.0.1:3307/runique_test
      DATABASE_URL_PG: postgres://runique:runique_test@127.0.0.1:5433/runique_test
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"

      # Each test run works in its own database (`runique_test_<id>`): the
      # account needs to create them.
      - name: Configure MySQL test permissions
        run: |
          docker exec ${{ job.services.mysql.id }} \
            mysql -uroot -proot -e \
            "GRANT ALL PRIVILEGES ON *.* TO 'runique'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;"

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ matrix.features }}-${{ hashFiles('**/Cargo.toml') }}

      # demo-app's tests read `demo-app/.env` and work on its real tables: its
      # own database, then its migrations applied by the command, installed
      # the way a user installs it.
      - name: Run tests
        run: cargo test --verbose ${{ matrix.workspace && '--workspace --exclude demo-app --exclude migration' || '' }} --features ${{ matrix.features }}
        working-directory: ${{ matrix.dir }}

  # demo-app the way a project is set up: its `Cargo.toml` names one engine
  # and one key type, and both change from one job to the next. One job per
  # pair, each with its own database and nothing else: a container for
  # Postgres and MySQL, a file for SQLite. The env file is the one
  # `demo-app/src/runique_test/mod.rs` names for that engine; the tables come
  # from the command, installed the way a user installs it.
  demo:
    name: demo-app (${{ matrix.engine }}, ${{ matrix.key }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [postgres, mysql, sqlite]
        # `int` is the key type without any feature.
        key: [int, big-pk, pk-uuid]
        include:
          - engine: postgres
            container: >-
              -p 5433:5432
              -e POSTGRES_USER=runique
              -e POSTGRES_PASSWORD=runique_test
              -e POSTGRES_DB=runique_demo
              -e POSTGRES_INITDB_ARGS="--locale=C --lc-messages=C"
              --health-cmd="pg_isready -h 127.0.0.1 -U runique -d runique_demo"
              postgres:16-alpine
            env_file: .env
            url: postgres://runique:runique_test@127.0.0.1:5433/runique_demo
          - engine: mysql
            container: >-
              -p 3307:3306
              -e MYSQL_ROOT_PASSWORD=root
              -e MYSQL_USER=runique
              -e MYSQL_PASSWORD=runique_test
              -e MYSQL_DATABASE=runique_demo
              --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
              mysql:8.4
            env_file: .env.mysql
            url: mysql://runique:runique_test@127.0.0.1:3307/runique_demo
          # No container: the database is a file, created by the first connection.
          - engine: sqlite
            env_file: .env.sqlite
            url: sqlite://${{ github.workspace }}/demo-app/ci.db?mode=rwc
    env:
      # Read at compile time by the model macros, and by the command.
      DB_ENGINE: ${{ matrix.engine }}
      DATABASE_URL: ${{ matrix.url }}
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-demo-${{ matrix.engine }}-${{ matrix.key }}-${{ hashFiles('**/Cargo.toml') }}

      # Started here, not as a service: SQLite has none, and a job can't
      # leave a service out for one engine. Waits until the engine answers.
      - name: Start the database container
        if: matrix.container
        run: |
          docker run -d --name db --health-interval=5s --health-timeout=5s --health-retries=10 ${{ matrix.container }}
          for _ in $(seq 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' db)" = healthy ] && exit 0
            sleep 2
          done
          docker logs db
          exit 1

      # The engine and the key type are written where a project writes them:
      # the default features of the app, and the `runique` line of its
      # `migration` crate, which is built on its own by `runique migration up`.
      - name: Set the engine and the key type in demo-app's Cargo.toml
        run: |
          features='"${{ matrix.engine }}"'
          if [ "${{ matrix.key }}" != "int" ]; then
            features="$features, \"${{ matrix.key }}\""
            sed -i 's|^runique = { path = "../../runique" }|runique = { path = "../../runique", features = ["${{ matrix.key }}"] }|' demo-app/migration/Cargo.toml
            grep -q '"${{ matrix.key }}"' demo-app/migration/Cargo.toml
          fi
          sed -i "s|^default = .*|default = [$features]|" demo-app/Cargo.toml
          grep '^default = ' demo-app/Cargo.toml
          grep '^runique = ' demo-app/migration/Cargo.toml

      - name: Write demo-app's env file
        run: |
          cat > demo-app/${{ matrix.env_file }} <<'EOF'
          RUNIQUE_ENV=dev
          DEBUG=true
          DB_ENGINE=${{ matrix.engine }}
          DATABASE_URL=${{ matrix.url }}
          SECRET_KEY=ci-only-key-with-at-least-32-characters
          EOF

      - name: Install the runique command
        run: cargo install --path runique/runique_cli --force

      # The migrations kept in the repository are written for `int` keys:
      # another key type has them written again from the models.
      - name: Write the migrations for this key type
        if: matrix.key != 'int'
        working-directory: demo-app
        run: |
          find migration/src -maxdepth 1 -name 'm[0-9]*.rs' -delete
          rm -rf migration/src/snapshots migration/src/lib.rs
          runique makemigrations

      - name: Apply demo-app's migrations
        run: runique migration up
        working-directory: demo-app

      - name: Run demo-app's tests
        run: cargo test --verbose -p demo-app

  # `runique new`'s project, built against this checkout: the scaffold must
  # follow the API. Ignored locally (it compiles a whole project).
  scaffold:
    name: Generated project compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"

      - name: Generated project compiles
        run: cargo test --lib --features all-databases the_generated_project_compiles -- --ignored
        working-directory: runique/runique_cli

  # The engines are mutually exclusive for a user, who always builds one of
  # them alone: every other job uses `all-databases`, so a `cfg` branch of a
  # single engine is only compiled here.
  engines:
    name: Single engine (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [sqlite, postgres, mysql, "sqlite,admin", "postgres,admin", "mysql,admin"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"

      - name: Check
        run: cargo check --features ${{ matrix.features }}
        working-directory: runique

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      # Blocking: a known vulnerability in a dependency fails the build. The
      # advisories ignored, and why, are in `.cargo/audit.toml`.
      - name: Run security audit
        run: cargo audit

  js:
    name: JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run JavaScript tests
        run: node --test 'runique/tests/js/*.test.mjs'

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Same features as `[package.metadata.docs.rs]` in runique/Cargo.toml:
      # what passes here is what docs.rs builds.
      - name: Build documentation
        run: cargo doc --no-deps --features all-databases,admin,acme
        working-directory: runique