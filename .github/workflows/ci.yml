name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No job writes to the repository: the token stays read-only.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DB_ENGINE: postgres

jobs:
  # Formatting, lints and the workspace build: no database needed.
  lint:
    name: Format, clippy, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.toml') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      # `big-pk` et `pk-uuid` sont mutuellement exclusives (compile_error! si les deux
      # sont actives) — --all-features les active toutes les deux à la fois, donc le
      # sweep principal les exclut ici et chacune est testée séparément juste après.
      - name: Run clippy
        run: cargo clippy --all-targets --features orm,sqlite,postgres,mysql,mariadb,all-databases,acme,admin,test-utils -- -D warnings

      # working-directory: runique — sans ça, cargo cible tout le workspace (demo-app
      # inclus), qui hérite de la feature par unification et casse pour du code qui
      # ne l'a jamais demandée (cf. contribution.rs, seeds/*.rs en i32 en dur).
      - name: Run clippy (big-pk)
        run: cargo clippy --all-targets --features big-pk -- -D warnings
        working-directory: runique

      - name: Run clippy (pk-uuid)
        run: cargo clippy --all-targets --features pk-uuid -- -D warnings
        working-directory: runique

      - name: Build
        run: cargo build --verbose --features orm,sqlite,postgres,mysql,mariadb,all-databases,acme,admin

  # One job per feature set, in parallel, each on its own runner with a fresh
  # MariaDB and Postgres: no table left by one key type (int, bigint, uuid)
  # in the way of the next.
  test:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Without `test-utils`, six modules are left out with no warning (0 test
          # run): test_validation_form, test_form_guarantees, test_hooks,
          # test_login_form, test_builder and the handler_req helper.
          - name: all features
            features: orm,sqlite,postgres,mysql,mariadb,all-databases,acme,admin,test-utils
          - name: big-pk
            features: big-pk,all-databases,admin
          - name: pk-uuid
            features: pk-uuid,all-databases,admin
          # The admin is an opt-in feature: the framework must build and pass its
          # tests without it too (admin tests are `#[cfg(feature = "admin")]`).
          - name: without admin
            features: all-databases
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_USER: runique
          MARIADB_PASSWORD: runique_test
          MARIADB_DATABASE: runique_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      # Same settings as docker-compose.yml: messages in English (`lc-messages=C`),
      # which some tests read.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: runique
          POSTGRES_PASSWORD: runique_test
          POSTGRES_DB: runique_test
          POSTGRES_INITDB_ARGS: "--locale=C --lc-messages=C"
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U runique -d runique_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL_MARIADB: mysql://runique:runique_test@127.0.0.1:3307/runique_test
      DATABASE_URL_PG: postgres://runique:runique_test@127.0.0.1:5433/runique_test
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"

      # Each test run works in its own database (`runique_test_<id>`): the
      # account needs to create them.
      - name: Configure MariaDB test permissions
        run: |
          docker exec ${{ job.services.mariadb.id }} \
            mariadb -uroot -proot -e \
            "GRANT ALL PRIVILEGES ON *.* TO 'runique'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;"

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ matrix.features }}-${{ hashFiles('**/Cargo.toml') }}

      - name: Run tests
        run: cargo test --verbose --features ${{ matrix.features }}
        working-directory: runique

  # `runique new`'s project, built against this checkout: the scaffold must
  # follow the API. Ignored locally (it compiles a whole project).
  scaffold:
    name: Generated project compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"

      - name: Generated project compiles
        run: cargo test --lib --features all-databases the_generated_project_compiles -- --ignored
        working-directory: runique

  # The engines are mutually exclusive for a user, who always builds one of
  # them alone: every other job uses `all-databases`, so a `cfg` branch of a
  # single engine is only compiled here.
  engines:
    name: Single engine (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [sqlite, postgres, mysql, "sqlite,admin", "postgres,admin", "mysql,admin"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"

      - name: Check
        run: cargo check --features ${{ matrix.features }}
        working-directory: runique

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      # Blocking: a known vulnerability in a dependency fails the build. The
      # advisories ignored, and why, are in `.cargo/audit.toml`.
      - name: Run security audit
        run: cargo audit

  js:
    name: JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run JavaScript tests
        run: node --test 'runique/tests/js/*.test.mjs'

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Same features as `[package.metadata.docs.rs]` in runique/Cargo.toml:
      # what passes here is what docs.rs builds.
      - name: Build documentation
        run: cargo doc --no-deps --features all-databases,admin,acme
        working-directory: runique