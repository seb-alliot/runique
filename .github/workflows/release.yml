name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Security audit
    runs-on: ubuntu-latest
    # Empêche l'exécution sur les forks si nécessaire
    if: github.repository_owner != 'actions'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Étape cruciale : installer cargo-audit sinon la commande échouera
      - name: Install cargo-audit
        run: cargo install cargo-audit

      # No ignored advisory: rsa, async-std and instant are no longer in the
      # dependency tree (see SECURITY.md).
      - name: Security Audit
        run: cargo audit

      # Publication manuelle : cargo publish --token <token>
      # - name: Publish to crates.io
      #   run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}
      #   working-directory: runique
      #   env:
      #     CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}