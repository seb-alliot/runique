services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: runique
      POSTGRES_PASSWORD: runique_test
      POSTGRES_DB: runique_test
      POSTGRES_INITDB_ARGS: "--locale=C --lc-messages=C"
    ports:
      - "5433:5432"
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: during the first start, the init scripts run on a server
      # reachable through the socket only, which pg_isready would report ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U runique -d runique_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_USER: runique
      MARIADB_PASSWORD: runique_test
      MARIADB_DATABASE: runique_test
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The demo site, only with `--profile demo`: `docker compose up -d` alone
  # keeps starting the test databases and nothing else.
  demo:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: demo-app/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    # Optional keys (SMTP_*, GROQ_API_KEY, RUNIQUE_MAX_UPLOAD_MB); the
    # `environment` below wins over the same keys in it.
    env_file:
      - path: demo-app/.env
        required: false
    environment:
      DEBUG: "true"
      DB_ENGINE: postgres
      DATABASE_URL: postgres://runique:runique_test@postgres:5432/runique_demo
      SECRET_KEY: ${SECRET_KEY:-local-demo-only-secret-key-not-for-production}
    ports:
      - "3000:3000"
