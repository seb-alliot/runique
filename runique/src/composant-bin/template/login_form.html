{% extends 'index.html' %}
{% block style %}
    {{ super() }}
    <link rel="stylesheet" href='{% static "css/inscription/inscription.css" %}'>
    <link rel="stylesheet" href='{% static "css/inscription/inscription-label.css" %}'>
{% endblock %}
{% block content %}
    <h1>{{ title }}</h1>

    {% messages %}
    <div id="form">
        <form method="post" action="/connexion">
            {% form.login_form %}
            <button type="submit">Sign in</button>
        </form>

        <div class="text-center mt-3">
            <a href="/">← Back home</a>
        </div>
    </div>
{% endblock %}
