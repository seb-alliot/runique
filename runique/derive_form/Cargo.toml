[package]
name = "derive_form"
version = "2.2.0"
edition = "2024"
authors = ["Itsuki"]
license = "MIT"
description = "Procedural macros for Runique web framework - automatic form generation from models"
repository = "https://github.com/seb-alliot/runique"
homepage = "https://runique.io/"
keywords = ["Itsuki", "framework", "runique", "web"]
categories = ["web-programming"]
readme = "README.md"


[lib]
proc-macro = true

[features]
big-pk = []
pk-uuid = []
# Reflètent la feature DB active sur `runique` (forwardée via runique/Cargo.toml),
# pour que le moteur soit connu au compile-time du macro sans lire `.env`.
sqlite = []
postgres = []
mysql = []
# Échappatoire explicite au compile_error! de mutuelle exclusion, forwardée par
# `runique/all-databases` — voir runique/Cargo.toml.
all-databases = []

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"