<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if title %}{{ title }}{% else %}Nouveau mot de passe{% endif %}</title>
    <link rel="stylesheet" href="{% runique_static "css/auth.css" %}">
</head>
<body>
{% block content %}
    <div class="card">
        <h1>{% if title %}{{ title }}{% else %}Nouveau mot de passe{% endif %}</h1>
        {% block message %}
            {% messages %}
        {% endblock %}

        {% if reset_done %}
            <div class="alert alert-success">
                Mot de passe mis à jour. <a href="/">Se connecter</a>
            </div>
        {% else %}
            <form method="post" action="{% link "reset_password" token=token %}">
                {% csrf %}
                {% form.reset_form %}
                <button type="submit" class="auth-submit">
                    Confirmer le nouveau mot de passe
                </button>
            </form>
        {% endif %}
    </div>
{% endblock %}
</body>
</html>
