<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if title %}{{ title }}{% else %}Réinitialiser le mot de passe{% endif %}</title>
    <link rel="stylesheet" href="{% runique_static "css/auth.css" %}">
</head>
<body>
{% block content %}
    <div class="card">
        <h1>{% if title %}{{ title }}{% else %}Réinitialiser le mot de passe{% endif %}</h1>
        {% block message %}
            {% messages %}
        {% endblock %}

        <form method="post">
            {% csrf %}
            {% form.forgot_form %}
            <button type="submit" class="auth-submit">
                Envoyer le lien
            </button>
        </form>
    </div>
{% endblock %}
</body>
</html>
