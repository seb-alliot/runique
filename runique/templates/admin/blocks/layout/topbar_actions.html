{# Right of the top bar: theme switch, back to the site, sign out. #}
<button type="button" class="admin-theme-toggle" id="themeToggle" aria-label="{% if admin_base_theme_toggle %}{{ admin_base_theme_toggle }}{% else %}Basculer le thème{% endif %}" aria-pressed="false">
    <svg class="admin-theme-icon admin-theme-icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
    </svg>
    <svg class="admin-theme-icon admin-theme-icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
</button>

<a href="{{ nav.site }}" class="btn btn-ghost btn-sm">
    {% if admin_base_back_to_site %}{{ admin_base_back_to_site }}{% else %}← Site{% endif %}
</a>
<form method="POST" action="{{ nav.logout }}" class="admin-logout__form">
    {% csrf %}
    <button type="submit" class="admin-topbar__user admin-logout__btn" title="{% if admin_base_logout_title %}{{ admin_base_logout_title }}{% endif %}">
        <div class="admin-topbar__avatar">
            {{ current_user.username }}
        </div>
        <span>{% if admin_base_logout_title %}{{ admin_base_logout_title }}{% else %}Déconnexion{% endif %}</span>
    </button>
</form>
