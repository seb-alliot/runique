{# Narrow the history to one model, one action, one account or one row. #}
<form method="GET" action="{% link "admin_history" %}" class="admin-search__row">
  <select name="resource" class="admin-search__input">
    <option value="">Toutes les ressources</option>
    {% for resource in history_resources %}
      <option value="{{ resource.key }}" {% if filter_resource == resource.key %}selected{% endif %}>{{ resource.title }}</option>
    {% endfor %}
  </select>
  <select name="action" class="admin-search__input">
    <option value="">Toutes les actions</option>
    <option value="create" {% if filter_action == "create" %}selected{% endif %}>Créé</option>
    <option value="update" {% if filter_action == "update" %}selected{% endif %}>Modifié</option>
    <option value="delete" {% if filter_action == "delete" %}selected{% endif %}>Supprimé</option>
  </select>
  {% if filter_object %}<input type="hidden" name="object" value="{{ filter_object }}">{% endif %}
  {% if filter_user %}<input type="hidden" name="user" value="{{ filter_user }}">{% endif %}
  <button type="submit" class="btn btn-secondary">Filtrer</button>
  {% if filter_resource or filter_action or filter_object or filter_user %}
    <a href="{% link "admin_history" %}" class="btn btn-ghost">Réinitialiser</a>
  {% endif %}
</form>
