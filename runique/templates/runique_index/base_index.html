<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runique is running</title>
    <link rel="stylesheet" href="{% runique_static "css/index/index.css" %}">
</head>
<body>
    <main class="index">
        <h1 class="index-title">Runique is running</h1>
        <p class="index-text">
            This page is shown because the application declares no <code>/</code> route
            and runs with <code>RUNIQUE_ENV=dev</code>. In production, <code>/</code> answers 404.
        </p>

        <section class="index-section">
            <h2>Next step</h2>
            <p class="index-text">Declare your home page in <code>src/url.rs</code>:</p>
            <pre><code>urlpatterns! {
    "/" => view! { index }, name = "index",
}</code></pre>
        </section>

        <nav class="index-links">
            <a class="index-link index-link-primary" href="https://runique.io/docs/en" rel="noopener">Documentation</a>
            <a class="index-link" href="https://github.com/seb-alliot/runique" rel="noopener">Source code</a>
        </nav>
    </main>
</body>
</html>
