[package]
name = "runique-cli"
version = "0.1.0"
edition = "2024"
authors = ["Itsuki"]
license = "MIT"
description = "The `runique` command of the Runique framework: new, makemigrations, migration, create-superuser, test"
repository = "https://github.com/seb-alliot/runique"
homepage = "https://runique.io/"
keywords = ["runique", "cli", "migrations"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "runique"
path = "src/main.rs"

[features]
# One installed command serves every project, whatever its engine: the three
# drivers by default. A single engine (`--no-default-features --features
# postgres`) only makes a lighter build.
default = ["all-databases"]
sqlite = ["sea-orm/sqlx-sqlite", "sea-orm-migration/sqlx-sqlite", "sea-orm/runtime-tokio-rustls"]
postgres = ["sea-orm/sqlx-postgres", "sea-orm-migration/sqlx-postgres", "sea-orm/runtime-tokio-rustls"]
mysql = ["sea-orm/sqlx-mysql", "sea-orm-migration/sqlx-mysql", "sea-orm/runtime-tokio-rustls"]
all-databases = ["sqlite", "postgres", "mysql"]
# The key type of the models read without a project.
big-pk = ["runique_dsl/big-pk"]
pk-uuid = ["runique_dsl/pk-uuid", "sea-orm/with-uuid"]

[dependencies]
runique_dsl.workspace = true
runique_atomic.workspace = true
runique_i18n.workspace = true
clap.workspace = true
anyhow.workspace = true
tokio.workspace = true
dotenvy.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
uuid.workspace = true
validator.workspace = true

# Database: the commands connect, and read what is already migrated.
sea-orm.workspace = true
sea-orm-migration.workspace = true
sea-query.workspace = true

# Reading the models and the migration files as Rust source.
syn.workspace = true
quote.workspace = true
proc-macro2.workspace = true

# Console: the superuser's questions, the destructive changes' report.
crossterm.workspace = true
dialoguer.workspace = true

# The superuser's password: the same algorithms as the framework.
argon2.workspace = true
bcrypt.workspace = true
scrypt.workspace = true
dyn-clone.workspace = true

# The connection: its address read and written, its own error lines.
url.workspace = true
urlencoding.workspace = true
tracing.workspace = true

[dev-dependencies]
# The framework itself, for the tests only: they create its tables, and
# compare each copied piece with the original. Never built at installation,
# so no feature of the command may name it: its engines are asked for here.
runique = { workspace = true, features = ["all-databases"] }
runique_atomic = { workspace = true, features = ["test-support"] }
