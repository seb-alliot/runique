# cargo-mutants, run from the workspace root.
#
# Every mutant reruns the whole test suite, and `runique` alone has about
# 4 500 of them (days of work): run it on the files you changed, e.g.
#   cargo mutants -p runique -f runique/src/forms/form_data.rs
#   cargo mutants -p runique_dsl              # small and pure: the whole crate
#
# Tests that need Postgres/MariaDB return early without the Docker databases.

# Same features as the full test suite. They belong to `runique`: a mutant of
# `derive_form` or `runique_dsl` built with them is refused by cargo ("does
# not contain these features") and counted "unviable" — the 2026-10-06 pass
# tested neither crate. Run those two without this file:
#   cargo mutants -p runique_dsl --no-config
#   cargo mutants -p derive_form --no-config --cargo-arg=--package=runique \
#     --features runique/all-databases --features runique/test-utils
# (derive_form is a proc-macro: runique's tests are what check its output.
# `--test-package` / `--test-workspace` don't reach the build, which keeps only
# `--package=derive_form` and then refuses the `runique/` features.)
features = ["runique/all-databases", "runique/test-utils"]
# The suite takes ~45 s; leave room for a slower machine before calling a
# mutant "timed out".
timeout_multiplier = 3.0

# The demo app is an example, not the framework: its generated code (admins/,
# migration/) only tests the generators, already covered by runique's own
# tests, and the rest is application code.
exclude_globs = ["demo-app/**"]
