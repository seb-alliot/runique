[package]
name = "demo-app"
version = "1.0.0"
edition = "2024"

[features]
# Le site tourne sur Postgres ; MariaDB / MySQL servent aux tests :
# `cargo test -p demo-app --no-default-features --features mariadb`.
default = ["postgres"]
postgres = ["runique/postgres"]
mariadb = ["runique/mariadb"]
mysql = ["runique/mysql"]
big-pk = ["runique/big-pk"]
pk-uuid = ["runique/pk-uuid"]

[dependencies]
runique = { path = "../runique", features = ["admin"] }

serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13.2", features = ["json"] }

chrono = "0.4"
tracing-subscriber = "0.3.22"
sea-orm = "=2.0.4"
sea-orm-migration = { version = "=2.0.4" }

[dev-dependencies]
# Turns on runique_test for `cargo test` / `runique test` only, never in a release build.
runique = { path = "../runique", features = ["test-utils"] }
