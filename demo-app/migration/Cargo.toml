[package]
name = "migration"
version = "0.1.0"
edition = "2021"

[dependencies]
sea-orm-migration = { version = "2.0.4", features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "sqlx-mysql",
    "sqlx-sqlite",
] }

tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
runique = { path = "../../runique" }